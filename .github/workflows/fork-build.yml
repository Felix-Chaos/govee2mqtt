name: Fork binary build
on:
  push:
    branches: [fork-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --all
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cross
      - run: ./scripts/build-cross.sh linux/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: govee-amd64
          path: docker-target/linux/amd64/govee
